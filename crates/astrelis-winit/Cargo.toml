[package]
name = "astrelis-winit"
description = "Window and application lifecycle integration between Astrelis and winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
gles = ["astrelis/gles"]
x11-drag = ["dep:x11rb"]

[dependencies]
log.workspace = true
astrelis = { path = "../astrelis", version = "0.4.0-dev.0" }
profiling.workspace = true
winit.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
pollster.workspace = true
x11rb = { version = "0.13.2", optional = true, features = ["shape", "xtest"] }

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "scheduling"
harness = false

[lints]
workspace = true

[[example]]
name = "native_drag_x11"
required-features = ["x11-drag"]
