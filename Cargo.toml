[workspace]
resolver = "3"
members = ["crates/astrelis", "crates/astrelis-winit"]

[workspace.package]
version = "0.4.0-dev.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["hxyulin <hxyulin@proton.me>"]
repository = "https://github.com/hxyulin/astrelis"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std"] }
bymsdfgen-core = { version = "0.1.1", default-features = false }
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }
profiling = { version = "1.0.18", default-features = false }
lyon_tessellation = "1.0.22"
unicode-segmentation = "1.13.3"
wgpu = { version = "30.0.1", default-features = false, features = [
    "std", "parking_lot", "wgsl", "metal", "vulkan", "dx12", "webgpu",
] }
pollster = "0.4"
winit = "0.30.13"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
