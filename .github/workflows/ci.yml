name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hooks:
    name: Formatting, typos and file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - uses: j178/prek-action@v3.0.1

  test:
    name: Clippy, tests and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # GPU tests run headless on Mesa's software Vulkan driver (lavapipe).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Under 4x MSAA, lavapipe covers pixels just outside a scissor that starts
      # inside the viewport; hardware drivers do not. Skip these until resolved.
      - run: >-
          cargo test --workspace --locked --
          --skip brush::tests::msaa_viewport_reflection_and_normalized_brush_coordinates_are_consistent
          --skip path::tests::coverage_transforms_viewport_clipping_and_msaa_work
          --skip point_renderer::tests::ranges_ring_order_widths_and_marker_radii_are_fixed_under_zoom
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
