name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_gpu:
        description: Run full tests on the trusted self-hosted macOS Metal GPU runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hooks:
    name: Formatting, typos and file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - uses: j178/prek-action@v3.0.1

  test:
    name: Clippy, tests and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # GPU tests run headless on Mesa's software Vulkan driver (lavapipe).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Under 4x MSAA, lavapipe covers pixels just outside a scissor that starts
      # inside the viewport; hardware drivers do not. Skip these until resolved.
      - run: >-
          cargo test --workspace --locked --
          --skip brush::tests::msaa_viewport_reflection_and_normalized_brush_coordinates_are_consistent
          --skip path::tests::coverage_transforms_viewport_clipping_and_msaa_work
          --skip point_renderer::tests::ranges_ring_order_widths_and_marker_radii_are_fixed_under_zoom
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  native:
    name: Native compilation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  wasm:
    name: WebAssembly and WebGPU browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The desktop runner/examples remain outside the wasm API.
      - run: cargo check --workspace --lib --target wasm32-unknown-unknown --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: sh examples/web/build.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/web/package-lock.json
      - run: npm ci
        working-directory: examples/web
      - run: npx playwright install --with-deps chromium
        working-directory: examples/web
      - run: npm test
        working-directory: examples/web

  macos-gpu:
    name: Full tests on macOS Metal hardware
    # Explicit dispatch keeps untrusted PR code off a persistent hardware runner.
    # Register a trusted Mac with these labels; no hosted GPU is assumed.
    if: github.event_name == 'workflow_dispatch' && inputs.macos_gpu
    runs-on: [self-hosted, macOS, astrelis-gpu]
    timeout-minutes: 30
    env:
      ASTRELIS_REQUIRE_METAL_GPU: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      # Includes the three MSAA/scissor cases excluded only on lavapipe above.
      - run: cargo test --workspace --locked -- --nocapture
      # Harness-free benchmarks compile raw shaders at runtime. Compilation and
      # unit tests alone cannot detect mismatched reference pipeline interfaces.
      - name: Benchmark pixel-equivalence smoke checks
        run: |
          cargo bench -p astrelis --locked --bench rendering -- --counts 1,1025 --samples 5 --warmup 1
          cargo bench -p astrelis --locked --bench paths -- --counts 1,1025 --samples 5 --warmup 1
          cargo bench -p astrelis --locked --bench points -- --counts 256,4097 --samples 5
          cargo bench -p astrelis --locked --bench mixed_ui -- --frames 8 --warmup 2 --in-flight 3
